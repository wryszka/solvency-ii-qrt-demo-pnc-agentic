# AI agents bootstrap — UC functions + agent registration + supervisor endpoint
# deploy. One-shot serverless job, idempotent.
#
# Task DAG:
#
#   apply_uc_functions ─→ register_agents ─→ deploy_supervisor_endpoint
#
# Run once after `databricks bundle deploy -t dev --profile DEV` (and after the
# governance_setup job has run, since some UC Functions reference gold tables
# that governance_setup creates).
#
# `apply_uc_functions`     — creates fn_* in UC under {catalog}.{schema} (the agent's tools)
# `register_agents`        — logs + registers the ResponsesAgent (Mosaic AI Agent
#                            Framework) in UC, tools = the fn_* UC functions
# `deploy_supervisor_endpoint` — serves it via databricks.agents.deploy() (scoped
#                            auto-auth, no baked token)

resources:
  jobs:
    ai_agents_setup:
      name: "AI Agents Setup — UC Functions + Agent Registration + Serving Endpoint"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: warehouse_id
          default: ${var.warehouse_id}

      tasks:
        - task_key: apply_uc_functions
          notebook_task:
            notebook_path: ../src/07_AI_Agents/apply_uc_functions.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name:  ${var.schema_name}
          environment_key: default

        - task_key: register_agents
          depends_on:
            - task_key: apply_uc_functions
          notebook_task:
            notebook_path: ../src/07_AI_Agents/register_agents.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name:  ${var.schema_name}
              fm_endpoint:  databricks-claude-sonnet-5
              model_name:   agent_workbench_supervisor
          environment_key: default

        - task_key: deploy_supervisor_endpoint
          depends_on:
            - task_key: register_agents
          notebook_task:
            notebook_path: ../src/07_AI_Agents/deploy_supervisor_endpoint.py
            base_parameters:
              catalog_name:  ${var.catalog_name}
              schema_name:   ${var.schema_name}
              endpoint_name: workbench-supervisor
              model_name:    agent_workbench_supervisor
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"
            # Mosaic AI Agent Framework stack. The register step authors a
            # ResponsesAgent (LangGraph + UC-function tools); the deploy step uses
            # databricks.agents.deploy(). No databricks-sql-connector/pandas — the
            # agent reads data through governed UC-function tools, not raw SQL.
            dependencies:
              - mlflow>=3.1
              - databricks-agents
              - databricks-langchain
              - langgraph
              - unitycatalog-ai[databricks]
              - databricks-sdk
              - pydantic>=2
